<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টিউশন হাজিরা ও PWA ম্যানেজার</title>
    <!-- Manifest Link for PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-6 rounded-2xl shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold"><i class="fa-solid fa-graduation-cap mr-2"></i> টিউশন হাজিরা ম্যানেজার</h1>
                <p class="text-indigo-100 text-sm mt-1">ছাত্রদের হাজিরা, মাসিক টার্গেট ও অফলাইন শিডিউল</p>
            </div>
            <button onclick="openModal()" class="bg-white text-indigo-600 px-5 py-2.5 rounded-xl font-semibold shadow hover:bg-indigo-50 transition cursor-pointer">
                <i class="fa-solid fa-plus mr-1"></i> নতুন ছাত্র যোগ করুন
            </button>
        </header>

        <!-- Student List Container -->
        <div id="student-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Dynamic Cards will load here -->
        </div>
    </div>

    <!-- Modal for Adding Student -->
    <div id="studentModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <h2 class="text-xl font-bold mb-4 text-slate-800"><i class="fa-solid fa-user-plus text-indigo-600 mr-2"></i> নতুন ছাত্রের তথ্য</h2>
            <form id="studentForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-600 mb-1">ছাত্রের নাম</label>
                    <input type="text" id="name" required placeholder="যেমন: রহিম আহমেদ" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-600 mb-1">ক্লাস / বিষয়</label>
                    <input type="text" id="subject" placeholder="যেমন: ১০ম শ্রেণি - পদার্থবিজ্ঞান" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="mb-4 grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">মাসিক টার্গেট (দিন)</label>
                        <input type="number" id="targetDays" value="16" min="1" max="31" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">নির্ধারিত সময়</label>
                        <input type="time" id="classTime" value="16:00" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl hover:bg-slate-300 transition cursor-pointer">বাতিল</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition cursor-pointer">সংরক্ষণ করুন</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let students = JSON.parse(localStorage.getItem('tuition_students')) || [];

        function openModal() {
            const modal = document.getElementById('studentModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('studentModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('studentForm').reset();
        }

        // Form Submit Event Listener
        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const targetDays = parseInt(document.getElementById('targetDays').value) || 16;
            const classTime = document.getElementById('classTime').value;

            if(!name || !subject) {
                alert('দয়া করে সঠিক তথ্য দিন।');
                return;
            }

            const newStudent = {
                id: Date.now(),
                name: name,
                subject: subject,
                targetDays: targetDays,
                classTime: classTime,
                attendance: []
            };

            students.push(newStudent);
            saveAndRender();
            closeModal();
        });

        function deleteStudent(id) {
            if(confirm('আপনি কি এই ছাত্রের তথ্য মুছে ফেলতে চান?')) {
                students = students.filter(s => s.id !== id);
                saveAndRender();
            }
        }

        function toggleAttendance(studentId, dateStr) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            const index = student.attendance.indexOf(dateStr);
            if (index > -1) {
                student.attendance.splice(index, 1);
            } else {
                student.attendance.push(dateStr);
            }
            saveAndRender();
        }

        function updateTime(studentId, newTime) {
            const student = students.find(s => s.id === studentId);
            if (student) {
                student.classTime = newTime;
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('tuition_students', JSON.stringify(students));
            renderStudents();
        }

        function renderStudents() {
            const container = document.getElementById('student-list');
            container.innerHTML = '';

            if (students.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white rounded-2xl shadow-sm border border-slate-200">
                        <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-500">কোনো ছাত্রের তথ্য যোগ করা হয়নি। উপরের "নতুন ছাত্র যোগ করুন" বাটনে ক্লিক করুন।</p>
                    </div>`;
                return;
            }

            students.forEach(student => {
                const attendedDays = student.attendance.length;
                const progressPercent = Math.min(Math.round((attendedDays / student.targetDays) * 100), 100);

                // Generate last 4 days for quick attendance check
                let daysHtml = '';
                for (let i = 3; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const dStr = d.toISOString().split('T')[0];
                    const dayName = d.toLocaleDateString('bn-BD', { weekday: 'short', day: 'numeric' });
                    const isChecked = student.attendance.includes(dStr);

                    daysHtml += `
                        <button onclick="toggleAttendance(${student.id}, '${dStr}')" 
                            class="px-2.5 py-1.5 text-xs rounded-lg border font-medium transition cursor-pointer ${isChecked ? 'bg-emerald-500 text-white border-emerald-500 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}">
                            ${dayName} ${isChecked ? '<i class="fa-solid fa-check ml-1"></i>' : ''}
                        </button>`;
                }

                const card = document.createElement('div');
                card.className = 'bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800">${student.name}</h3>
                                <p class="text-xs text-slate-500"><i class="fa-solid fa-book-open mr-1"></i> ${student.subject}</p>
                            </div>
                            <button onclick="deleteStudent(${student.id})" class="text-slate-400 hover:text-red-500 transition cursor-pointer p-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>

                        <!-- Target Progress -->
                        <div class="my-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <div class="flex justify-between text-xs font-semibold mb-1">
                                <span class="text-slate-600">মাসিক টার্গেট অগ্রগতি:</span>
                                <span class="text-indigo-600">${attendedDays} / ${student.targetDays} দিন (${progressPercent}%)</span>
                            </div>
                            <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                <div class="bg-indigo-600 h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>

                        <!-- Time Config & Reminder -->
                        <div class="flex items-center justify-between mb-4 text-sm bg-indigo-50/50 p-3 rounded-xl border border-indigo-100/50">
                            <div class="flex items-center gap-2">
                                <i class="fa-regular fa-clock text-indigo-600"></i>
                                <span class="text-slate-600 text-xs">সময়:</span>
                                <input type="time" value="${student.classTime}" onchange="updateTime(${student.id}, this.value)" class="bg-white px-2 py-1 border rounded-lg text-xs font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer">
                            </div>
                            <button onclick="setReminder('${student.name}', '${student.classTime}')" class="text-xs bg-indigo-600 text-white px-2.5 py-1.5 rounded-lg hover:bg-indigo-700 transition cursor-pointer shadow-sm">
                                <i class="fa-regular fa-bell mr-1"></i> রিমাইন্ডার
                            </button>
                        </div>

                        <!-- Quick Attendance Days -->
                        <div>
                            <p class="text-xs font-medium text-slate-500 mb-2">সাম্প্রতিক হাজিরা (টপকে টিক দিন):</p>
                            <div class="flex flex-wrap gap-1.5">
                                ${daysHtml}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Reminder Logic
        function setReminder(studentName, classTime) {
            if (!("Notification" in window)) {
                alert("আপনার ব্রাউজার ব্রাউজার নোটিফিকেশন সাপোর্ট করে না।");
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert(`"${studentName}" এর জন্য ${classTime} সময়ে রিমাইন্ডার সেট করা হয়েছে!`);
                } else {
                    alert("নোটিফিকেশন পারমিশন পাওয়া যায়নি। ব্রাউজার সেটিংস থেকে অনুমতি দিন।");
                }
            });
        }

        // Service Worker Registration for PWA Offline Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.log('Service Worker Registration Failed', err));
            });
        }

        // Initial Load
        renderStudents();
    </script>
</body>
      </html>
